# PsiOS Cloudflare Worker Configuration
name = "psios-licensing-worker"
main = "worker.js"
compatibility_date = "2024-10-01"
account_id = "196402e5dc65c15e6c68ba7ffa7ee431"

# Variables de entorno
[vars]
ENVIRONMENT = "production"

# Configuración de KV Namespace (Keys de Producto y Usuarios)
[[kv_namespaces]]
binding = "PSIOS_LICENSES"
id = "fcf090b49db545e580f86ce6717e1412"

# Configuración de R2 Bucket (Servidor de Libros, Tests y Recursos)
[[r2_buckets]]
binding = "PSIOS_RESOURCES"
bucket_name = "psios-recursos"
